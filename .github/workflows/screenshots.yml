name: screenshots
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: go build -ldflags '-X main.version=1.0.0' -o /tmp/calendar-boundary-lab ./cmd/server
      - name: Start the service
        run: |
          /tmp/calendar-boundary-lab >/tmp/calendar-boundary-lab.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/readyz; then exit 0; fi
            sleep 1
          done
          cat /tmp/calendar-boundary-lab.log
          exit 1
      - name: Capture real application screenshots
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          node scripts/capture-screenshots.mjs
      - name: Publish screenshots to the repository and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/*.png
          git commit -m "Add real application screenshots"
          git push origin HEAD:main
          gh release upload v1.0.0 docs/screenshots/*.png --clobber
