name: helm-release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: azure/setup-helm@v5
      - name: Configure Pages index commit identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Publish chart to GitHub Pages
        uses: helm/chart-releaser-action@v1.7.0
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        with:
          charts_dir: charts
      - name: Verify the public Helm repository
        env:
          HELM_REPO_URL: https://mateopedersen.github.io/betacalendars-calendar-boundary-lab
        run: |
          for attempt in $(seq 1 24); do
            if curl --fail --silent --show-error "$HELM_REPO_URL/index.yaml" -o /tmp/index.yaml; then
              break
            fi
            if [ "$attempt" -eq 24 ]; then
              echo "GitHub Pages did not serve index.yaml after 2 minutes" >&2
              exit 1
            fi
            sleep 5
          done
          curl --fail --silent --show-error "$HELM_REPO_URL/artifacthub-repo.yml" -o /tmp/artifacthub-repo.yml
          grep -qx 'repositoryID: 9bc1ede2-5b3a-4a4e-a573-cc9174c63c79' /tmp/artifacthub-repo.yml
          helm repo add betacalendars "$HELM_REPO_URL"
          helm repo update
          helm search repo betacalendars/betacalendars-calendar-boundary-lab --versions | tee /tmp/chart-search.txt
          grep -q '0.1.1' /tmp/chart-search.txt
          helm pull betacalendars/betacalendars-calendar-boundary-lab --version 0.1.1
          helm install --dry-run boundary-lab betacalendars/betacalendars-calendar-boundary-lab --version 0.1.1
