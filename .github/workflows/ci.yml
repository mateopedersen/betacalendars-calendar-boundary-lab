name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: python -m pip install -r docs/requirements.txt
      - run: mkdocs build --strict
      - run: python scripts/check_external_docs_links.py
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test ./...
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - run: helm lint charts/betacalendars-calendar-boundary-lab
      - run: helm template boundary-lab charts/betacalendars-calendar-boundary-lab > /tmp/rendered.yaml
      - run: helm template boundary-lab charts/betacalendars-calendar-boundary-lab --set ingress.enabled=true --set autoscaling.enabled=true --set networkPolicy.enabled=true > /tmp/hardened.yaml
